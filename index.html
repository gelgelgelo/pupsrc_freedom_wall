<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PUPSRC Freedom Wall</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>
  <div class="app">
    <header>
      <h1>PUPSRC Freedom Wall</h1>
      <button id="open-post-btn" type="button">Create a post</button>
    </header>

    <form id="post-form">
      <textarea id="post-input" maxlength="500" placeholder="Share what's on your mind..." required></textarea>
      <button id="submit-post-btn" type="submit">Post to Wall</button>
    </form>

    <div class="search-bar">
      <input
        id="search-input"
        type="search"
        placeholder="Search keywords..."
        aria-label="Search posts by keyword"
      />
      <button id="clear-search-btn" type="button" aria-label="Clear search" hidden>✕</button>
    </div>

    <div class="sort-tabs" role="tablist" aria-label="Sort posts">
      <button
        type="button"
        class="sort-tab active"
        data-sort="latest"
        role="tab"
        aria-selected="true"
      >Latest</button>
      <button
        type="button"
        class="sort-tab"
        data-sort="popular"
        role="tab"
        aria-selected="false"
      >Popular</button>
      <button
        type="button"
        class="sort-tab"
        data-sort="recent"
        role="tab"
        aria-selected="false"
      >Recent</button>
    </div>

    <!-- Developer Pinned Message (Below Search Bar) -->
    <aside id="pinned-message" class="pinned-message" aria-label="Pinned developer announcement" hidden>
      <div class="pinned-header">
        <div class="pinned-header-left">
          <span class="pinned-badge">📌 pinned</span>
          <h2 id="pinned-title" class="pinned-title"></h2>
        </div>
        <button
          id="close-pinned-btn"
          type="button"
          aria-label="Dismiss pinned message"
        >✕</button>
      </div>
      <p id="pinned-body" class="pinned-body"></p>
    </aside>

    <section id="feed" aria-live="polite"></section>
  </div>

  <!-- Comment Modal / Bottom Sheet -->
  <div id="post-modal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-drag-bar" id="modal-drag-bar">
        <span class="drag-pill"></span>
      </div>

      <div class="modal-header">
        <h2 id="modal-title">Post Thread</h2>
        <button id="close-modal-btn" type="button" aria-label="Close thread">✕</button>
      </div>

      <div class="modal-scroll-area" id="modal-scroll-area">
        <div id="modal-post-body" class="modal-post-body"></div>

        <div class="comments-section">
          <h3 id="comments-heading">Comments (0)</h3>
          <div id="comments-list" class="comments-list"></div>
        </div>
      </div>

      <div id="reply-banner" class="reply-banner" hidden>
        <div class="reply-banner-content">
          <span class="reply-banner-label">Replying to</span>
          <span id="reply-banner-preview" class="reply-banner-preview"></span>
        </div>
        <button id="cancel-reply-btn" type="button" aria-label="Cancel reply">✕</button>
      </div>

      <form id="comment-form" class="comment-form">
        <textarea
          id="comment-input"
          rows="1"
          maxlength="300"
          placeholder="Write a comment..."
          required
        ></textarea>
        <button id="submit-comment-btn" type="submit">Reply</button>
      </form>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
